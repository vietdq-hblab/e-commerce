<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hblab Store</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛍️</span>
      <h1>hblab Store</h1>
    </div>
    <div id="authArea" class="auth-area">
      <!-- populated by app.js -->
    </div>
  </header>

  <main class="layout">
    <section id="products" class="products">
      <h2>Products</h2>
      <div id="productGrid" class="product-grid">
        <p class="muted">Loading…</p>
      </div>
    </section>

    <aside class="cart-panel">
      <h2>Your Cart</h2>
      <div id="cartBody">
        <p class="muted">Log in to see your cart.</p>
      </div>
      <div id="cartFooter" class="cart-footer hidden">
        <div class="total-row">
          <span>Total</span>
          <strong id="cartTotal">$0.00</strong>
        </div>
        <button id="checkoutBtn" class="primary">Checkout</button>
      </div>
      <div id="checkoutMsg" class="checkout-msg"></div>
    </aside>
  </main>

  <!-- Auth modal -->
  <div id="authModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
        <button class="close" id="closeModal" aria-label="Close">×</button>
      </div>

      <form id="loginForm" class="pane active">
        <label>Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required minlength="6" /></label>
        <button type="submit" class="primary">Log in</button>
        <p class="form-error" data-for="login"></p>
      </form>

      <form id="registerForm" class="pane">
        <label>Name<input type="text" name="name" required /></label>
        <label>Email<input type="email" name="email" required /></label>
        <label>Password<input type="password" name="password" required minlength="6" /></label>
        <button type="submit" class="primary">Create account</button>
        <p class="form-error" data-for="register"></p>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
